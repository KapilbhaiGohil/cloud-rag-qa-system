apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  MONGO_URI: "mongodb://mongo:27017"
  DB_NAME: "rag_app"

  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  FRONTEND_URL: "http://myapp.local"
  MINIO_ENDPOINT: "minio:9000"
  

  MINIO_BUCKET_NAME: "rag-documents"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "chat_documents"
  
  GEMINI_MODEL: "gemini-3.1-flash-lite-preview"
  VECTOR_DIMENSION: "3072"
  VITE_API_URL: "/api"
  VITE_ALLOWED_HOSTS: "myapp.local,localhost"